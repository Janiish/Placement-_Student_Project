<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusVoyager - Travel Beyond Gravity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes drift { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.1); } 66% { transform: translate(-20px,20px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }
        .orb-1 { animation: drift 20s infinite alternate; }
        .orb-2 { animation: drift 25s infinite alternate-reverse; animation-delay: -5s; }
        .orb-3 { animation: drift 22s infinite alternate; animation-delay: -10s; }
        select option { background-color: #030712; color: white; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen relative overflow-x-hidden">
    <div class="fixed top-20 left-10 w-96 h-96 bg-blue-500/20 rounded-full filter blur-3xl orb-1 -z-10"></div>
    <div class="fixed bottom-20 right-10 w-96 h-96 bg-purple-500/20 rounded-full filter blur-3xl orb-2 -z-10"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/10 rounded-full filter blur-3xl orb-3 -z-10"></div>

    <nav class="fixed top-0 w-full z-50 bg-gray-950/80 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">BusVoyager</span>
            </a>
            <div class="hidden md:flex gap-6">
                <a href="#" class="text-gray-300 hover:text-white transition-colors">Routes</a>
                <a href="#" class="text-gray-300 hover:text-white transition-colors">My Bookings</a>
                <a href="#" class="text-gray-300 hover:text-white transition-colors">About</a>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-4 max-w-7xl mx-auto min-h-screen flex flex-col justify-center">
        <div class="text-center mb-10">
            <h1 class="text-6xl md:text-8xl font-bold mb-4">
                <span class="block text-white">Travel Beyond</span>
                <span class="block bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">Gravity</span>
            </h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto">Book your journey across the stars with our antigravity transport fleet.</p>
        </div>

        <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl shadow-blue-500/10 max-w-4xl mx-auto w-full transition-all duration-300 hover:shadow-blue-500/20 hover:-translate-y-1">
            <form id="searchForm" action="results.html" method="GET" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">From</label>
                        <select id="from" name="from" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Origin</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">To</label>
                        <select id="to" name="to" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Destination</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Date</label>
                        <input type="date" id="date" name="date" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none" style="color-scheme: dark;">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold rounded-xl px-8 py-4 flex items-center justify-center gap-2 transition-all duration-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Search Transport
                </button>
            </form>
        </div>

        <div class="mt-20">
            <h2 class="text-2xl font-bold mb-6">Popular Routes</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="popularRoutes"></div>
        </div>

        <div class="mt-20 grid grid-cols-1 md:grid-cols-3 gap-6 text-center border-t border-white/10 pt-10">
            <div><p class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent mb-2">10,000+</p><p class="text-gray-400">Bookings</p></div>
            <div><p class="text-4xl font-bold bg-gradient-to-r from-purple-400 to-purple-600 bg-clip-text text-transparent mb-2">500+</p><p class="text-gray-400">Buses</p></div>
            <div><p class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent mb-2">50+</p><p class="text-gray-400">Cities</p></div>
        </div>
    </main>

    <footer class="bg-gray-950 border-t border-white/10 py-8 mt-12 text-center text-gray-500 text-sm">
        <p>&copy; 2026 BusVoyager. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const dateInput = document.getElementById('date');
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            dateInput.min = new Date().toISOString().split('T')[0];
            dateInput.value = tomorrow.toISOString().split('T')[0];

            let cities;
            try {
                const res = await fetch('http://localhost:8080/api/cities');
                if (!res.ok) throw 0;
                cities = await res.json();
            } catch {
                cities = ['Delhi','Mumbai','Bangalore','Chennai','Pune','Nagpur','Hyderabad','Kolkata'];
            }

            ['from','to'].forEach(id => {
                const sel = document.getElementById(id);
                cities.forEach(c => sel.add(new Option(c, c)));
            });

            // Popular routes
            const routes = [
                { from: 'Delhi', to: 'Mumbai', price: '₹599', accent: 'blue' },
                { from: 'Bangalore', to: 'Chennai', price: '₹499', accent: 'blue' },
                { from: 'Pune', to: 'Nagpur', price: '₹799', accent: 'purple' }
            ];
            document.getElementById('popularRoutes').innerHTML = routes.map(r =>
                `<a href="results.html?from=${r.from}&to=${r.to}&date=2026-07-26" class="block bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 hover:-translate-y-2 hover:shadow-2xl hover:shadow-${r.accent}-500/20 transition-all duration-300 cursor-pointer group">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-lg font-semibold group-hover:text-${r.accent}-400 transition-colors">${r.from} <span class="text-gray-500 mx-2">→</span> ${r.to}</span>
                    </div>
                    <p class="text-gray-400 text-sm">From <span class="text-white font-bold text-lg">${r.price}</span></p>
                </a>`
            ).join('');
        });
    </script>
</body>
</html>
