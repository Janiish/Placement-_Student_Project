<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusVoyager - Seat Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes drift { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.1); } 66% { transform: translate(-20px,20px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }
        .orb-1 { animation: drift 20s infinite alternate; }
        .orb-2 { animation: drift 25s infinite alternate-reverse; animation-delay: -5s; }
        .orb-3 { animation: drift 22s infinite alternate; animation-delay: -10s; }
        .seat-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 0.75rem; max-width: max-content; margin: 0 auto; }
        .seat { width: 3rem; height: 3rem; }
        .seat-aisle { visibility: hidden; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen relative overflow-x-hidden">
    <div class="fixed top-20 left-10 w-96 h-96 bg-blue-500/20 rounded-full filter blur-3xl orb-1 -z-10"></div>
    <div class="fixed bottom-20 right-10 w-96 h-96 bg-purple-500/20 rounded-full filter blur-3xl orb-2 -z-10"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/10 rounded-full filter blur-3xl orb-3 -z-10"></div>

    <nav class="fixed top-0 w-full z-50 bg-gray-950/80 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">BusVoyager</span>
            </a>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-4 max-w-7xl mx-auto min-h-screen">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-xl">
                    <div class="flex justify-between items-end mb-6 border-b border-white/10 pb-4">
                        <div>
                            <h2 class="text-2xl font-bold text-white mb-1" id="busNameDisplay">Loading...</h2>
                            <p class="text-gray-400 text-sm" id="routeDisplay">...</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-bold text-blue-400" id="fareDisplay">₹--</span>
                            <p class="text-xs text-gray-500">per seat</p>
                        </div>
                    </div>
                    <div class="flex justify-center gap-6 mb-8 text-sm">
                        <div class="flex items-center gap-2"><div class="w-6 h-6 rounded bg-white/10 border-2 border-white/20"></div><span class="text-gray-400">Available</span></div>
                        <div class="flex items-center gap-2"><div class="w-6 h-6 rounded bg-red-500/10 border-2 border-red-500/20"></div><span class="text-gray-400">Booked</span></div>
                        <div class="flex items-center gap-2"><div class="w-6 h-6 rounded bg-gradient-to-br from-blue-500 to-purple-500 border-2 border-blue-400"></div><span class="text-gray-400">Selected</span></div>
                    </div>
                    <div class="bg-gray-900/50 p-8 rounded-2xl border border-white/5 relative mx-auto overflow-x-auto">
                        <div class="flex justify-end mb-6 pr-8">
                            <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" title="Driver"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                        </div>
                        <div id="seatMap" class="seat-grid"></div>
                    </div>
                </div>
                <div id="passengerForm" class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-xl hidden transition-all">
                    <h3 class="text-xl font-bold mb-4">Passenger Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-400 mb-1">Full Name</label>
                            <input type="text" id="pName" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-blue-500 outline-none" placeholder="John Doe">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                            <input type="email" id="pEmail" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-blue-500 outline-none" placeholder="john@example.com">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Phone</label>
                            <input type="tel" id="pPhone" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-blue-500 outline-none" placeholder="+91 9876543210">
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-xl sticky top-24">
                    <h3 class="text-lg font-bold mb-4">Booking Summary</h3>
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between text-sm"><span class="text-gray-400">Selected Seats</span><span id="selectedSeatsCount" class="font-bold text-white">0</span></div>
                        <div id="selectedSeatsList" class="flex flex-wrap gap-2 min-h-[2rem]"><span class="text-xs text-gray-500">None selected</span></div>
                        <div class="h-px w-full bg-white/10"></div>
                        <div class="flex justify-between items-center"><span class="text-gray-300">Total Fare</span><span id="totalFare" class="text-2xl font-bold text-white">₹0</span></div>
                    </div>
                    <button id="btnConfirm" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-xl px-4 py-4 transition-all flex justify-center items-center gap-2" disabled><span>Confirm Booking</span></button>
                    <div id="errorMsg" class="mt-4 text-red-400 text-sm text-center hidden"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let busData = null, selectedSeats = [], farePerSeat = 0;
        const $ = id => document.getElementById(id);
        const SEAT_BASE = 'seat rounded-lg flex items-center justify-center text-sm font-bold transition-all duration-200 select-none ';
        const SEAT_STYLES = {
            booked: 'bg-red-500/10 border-2 border-red-500/20 text-red-400/50 cursor-not-allowed',
            available: 'bg-white/10 border-2 border-white/20 text-gray-400 cursor-pointer hover:bg-blue-500/20 hover:border-blue-400 hover:text-white',
            selected: 'bg-gradient-to-br from-blue-500 to-purple-500 border-2 border-blue-400 text-white shadow-lg shadow-blue-500/30 scale-105 cursor-pointer'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(location.search);
            const busId = params.get('busId'), date = params.get('date'), routeFrom = params.get('from'), routeTo = params.get('to');

            if (routeFrom && routeTo) $('routeDisplay').textContent = `${routeFrom} to ${routeTo} | ${date}`;

            try {
                const res = await fetch(`http://localhost:8080/api/buses/${busId}/seats?date=${date}`);
                if (!res.ok) throw 0;
                busData = await res.json();
            } catch {
                busData = { busId: busId || 1, busName: 'Stellar Express', totalSeats: 40, bookedSeats: [1,5,12,13,20,39], fare: 1200 };
            }

            farePerSeat = busData.fare;
            $('busNameDisplay').textContent = busData.busName;
            $('fareDisplay').textContent = `₹${farePerSeat.toLocaleString('en-IN')}`;
            renderSeats(busData.totalSeats, busData.bookedSeats);
        });

        function renderSeats(total, booked) {
            const map = $('seatMap');
            map.innerHTML = '';
            let seatNum = 1;
            for (let r = 0; r < Math.ceil(total / 4); r++) {
                for (let i = 0; i < 2 && seatNum <= total; i++) map.appendChild(createSeat(seatNum++, booked));
                const aisle = document.createElement('div');
                aisle.className = 'seat seat-aisle';
                map.appendChild(aisle);
                for (let i = 0; i < 2 && seatNum <= total; i++) map.appendChild(createSeat(seatNum++, booked));
            }
        }

        function createSeat(num, booked) {
            const div = document.createElement('div');
            div.textContent = num;
            const isBooked = booked.includes(num);
            div.className = SEAT_BASE + SEAT_STYLES[isBooked ? 'booked' : 'available'];
            if (!isBooked) div.onclick = () => toggleSeat(num, div);
            return div;
        }

        function toggleSeat(num, el) {
            const idx = selectedSeats.indexOf(num);
            if (idx > -1) {
                selectedSeats.splice(idx, 1);
                el.className = SEAT_BASE + SEAT_STYLES.available;
            } else {
                if (selectedSeats.length >= 6) { showError("Maximum 6 seats allowed"); return; }
                selectedSeats.push(num);
                el.className = SEAT_BASE + SEAT_STYLES.selected;
            }
            updateSummary();
        }

        function updateSummary() {
            $('selectedSeatsCount').textContent = selectedSeats.length;
            $('selectedSeatsList').innerHTML = selectedSeats.length
                ? selectedSeats.sort((a,b) => a-b).map(s => `<span class="px-2 py-1 bg-blue-500/20 border border-blue-500/30 rounded text-blue-300 text-xs">${s}</span>`).join('')
                : '<span class="text-xs text-gray-500">None selected</span>';
            $('totalFare').textContent = `₹${(selectedSeats.length * farePerSeat).toLocaleString('en-IN')}`;
            $('btnConfirm').disabled = !selectedSeats.length;
            $('passengerForm').classList.toggle('hidden', !selectedSeats.length);
            $('errorMsg').classList.add('hidden');
        }

        function showError(msg) {
            const err = $('errorMsg');
            err.textContent = msg;
            err.classList.remove('hidden');
            setTimeout(() => err.classList.add('hidden'), 3000);
        }

        $('btnConfirm').addEventListener('click', async () => {
            const name = $('pName').value.trim(), email = $('pEmail').value.trim(), phone = $('pPhone').value.trim();
            if (!name || !email || !phone) { showError("Please fill all passenger details"); return; }

            const btn = $('btnConfirm');
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Processing...`;
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8080/api/bookings', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ busId: busData.busId, travelDate: new URLSearchParams(location.search).get('date'), seatNumbers: selectedSeats, passengerName: name, passengerEmail: email, passengerPhone: phone })
                });
                if (!res.ok) throw 0;
                const booking = await res.json();
                location.href = `confirmation.html?bookingId=${booking.bookingId}`;
            } catch {
                setTimeout(() => { location.href = `confirmation.html?bookingId=BKG-${Math.floor(Math.random()*100000)}`; }, 1000);
            }
        });
    </script>
</body>
</html>
