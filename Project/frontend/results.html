<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusVoyager - Search Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes drift { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.1); } 66% { transform: translate(-20px,20px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }
        .orb-1 { animation: drift 20s infinite alternate; }
        .orb-2 { animation: drift 25s infinite alternate-reverse; animation-delay: -5s; }
        .orb-3 { animation: drift 22s infinite alternate; animation-delay: -10s; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen relative overflow-x-hidden">
    <div class="fixed top-20 left-10 w-96 h-96 bg-blue-500/20 rounded-full filter blur-3xl orb-1 -z-10"></div>
    <div class="fixed bottom-20 right-10 w-96 h-96 bg-purple-500/20 rounded-full filter blur-3xl orb-2 -z-10"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/10 rounded-full filter blur-3xl orb-3 -z-10"></div>

    <nav class="fixed top-0 w-full z-50 bg-gray-950/80 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">BusVoyager</span>
            </a>
            <div class="hidden md:flex gap-6">
                <a href="#" class="text-gray-300 hover:text-white transition-colors">Routes</a>
                <a href="#" class="text-gray-300 hover:text-white transition-colors">My Bookings</a>
                <a href="#" class="text-gray-300 hover:text-white transition-colors">About</a>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-4 max-w-5xl mx-auto min-h-screen">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent" id="routeHeader">... → ...</h1>
                <p class="text-gray-400 mt-1 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="dateHeader">...</span>
                </p>
            </div>
            <a href="index.html" class="mt-4 md:mt-0 px-6 py-2 rounded-xl border border-white/20 hover:bg-white/10 transition-all text-sm font-medium">Modify Search</a>
        </div>

        <div id="loadingState" class="space-y-6 hidden">
            <div class="bg-white/5 border border-white/5 rounded-2xl p-6 h-32 animate-pulse"></div>
            <div class="bg-white/5 border border-white/5 rounded-2xl p-6 h-32 animate-pulse"></div>
        </div>

        <div id="emptyState" class="hidden text-center py-20 bg-white/5 border border-white/10 rounded-2xl backdrop-blur-xl">
            <svg class="w-16 h-16 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h2 class="text-2xl font-bold text-gray-300">No buses found</h2>
            <p class="text-gray-500 mt-2">Try adjusting your travel date or route.</p>
        </div>

        <div id="resultsContainer" class="space-y-6"></div>
    </main>

    <footer class="bg-gray-950 border-t border-white/10 py-8 mt-12 text-center text-gray-500 text-sm">
        <p>&copy; 2026 BusVoyager. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(location.search);
            const from = params.get('from') || 'Origin', to = params.get('to') || 'Destination', date = params.get('date') || '';

            document.getElementById('routeHeader').textContent = `${from} → ${to}`;
            if (date) document.getElementById('dateHeader').textContent = new Date(date).toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' });

            const loading = document.getElementById('loadingState'), empty = document.getElementById('emptyState'), container = document.getElementById('resultsContainer');
            loading.classList.remove('hidden');

            let buses;
            try {
                const res = await fetch(`http://localhost:8080/api/buses/search?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&date=${encodeURIComponent(date)}`);
                if (!res.ok) throw 0;
                buses = await res.json();
            } catch {
                buses = [
                    { busId: 1, busName: 'Stellar Express', busNumber: 'ST-001', busType: 'AC Sleeper', totalSeats: 40, departureTime: '18:00', arrivalTime: '06:00', fare: 1200, origin: from, destination: to, availableSeats: 15 },
                    { busId: 2, busName: 'Nebula Transits', busNumber: 'NB-204', busType: 'Non-AC Seater', totalSeats: 40, departureTime: '21:30', arrivalTime: '10:00', fare: 800, origin: from, destination: to, availableSeats: 5 }
                ];
            }

            loading.classList.add('hidden');
            if (!buses?.length) { empty.classList.remove('hidden'); return; }

            const fmtTime = t => { const [h,m] = t.split(':'); const d = new Date(); d.setHours(h,m,0); return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };

            buses.forEach(bus => {
                const card = document.createElement('div');
                card.className = "bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-xl hover:-translate-y-1 hover:shadow-2xl hover:shadow-blue-500/20 transition-all duration-300 flex flex-col md:flex-row justify-between items-center gap-6";
                card.innerHTML = `
                    <div class="flex-1 w-full text-center md:text-left">
                        <h3 class="text-xl font-bold text-white mb-2">${bus.busName}</h3>
                        <div class="flex items-center justify-center md:justify-start gap-3">
                            <span class="px-3 py-1 bg-blue-500/20 text-blue-400 text-xs font-semibold rounded-full">${bus.busType}</span>
                            <span class="text-sm text-gray-500">${bus.busNumber}</span>
                        </div>
                    </div>
                    <div class="flex-1 w-full flex flex-col items-center">
                        <div class="flex items-center gap-4 w-full justify-center">
                            <span class="text-2xl font-bold">${fmtTime(bus.departureTime)}</span>
                            <div class="flex-1 max-w-[100px] flex items-center"><div class="h-[2px] w-full bg-gradient-to-r from-blue-500/50 to-purple-500/50"></div></div>
                            <span class="text-2xl font-bold text-gray-300">${fmtTime(bus.arrivalTime)}</span>
                        </div>
                        <span class="text-xs text-gray-500 mt-2">${bus.origin} to ${bus.destination}</span>
                    </div>
                    <div class="flex-1 w-full flex flex-row md:flex-col justify-between md:justify-center items-center md:items-end gap-4">
                        <div class="text-center md:text-right">
                            <div class="text-3xl font-bold text-white">₹${bus.fare.toLocaleString('en-IN')}</div>
                            <div class="text-sm text-green-400 mt-1">${bus.availableSeats} Seats Left</div>
                        </div>
                        <a href="seats.html?busId=${bus.busId}&date=${date}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold rounded-xl px-6 py-2 transition-all shadow-lg shadow-blue-500/20">View Seats</a>
                    </div>`;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
